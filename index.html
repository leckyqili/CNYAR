function cyl(parent,name,material,a,b,r1,r2,segments=12){const dir=new THREE.Vector3().subVectors(new THREE.Vector3(...b),new THREE.Vector3(...a)),len=dir.length();const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,len,segments),material);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());mesh.position.set((a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2);mesh.name=name;parent.add(mesh);return mesh}

function resetPose(){model.position.set(0,0,0);model.rotation.set(0,0,0);for(const p of Object.values(movable)){p.rotation.set(0,0,0);if(p.name.startsWith('FabricPanel'))p.position.y=.82;}movable.body.position.set(0,0,0);for(const key of ['lidL','lidR']){movable[key].position.set(0,0,0);movable[key].scale.set(1,1,1)}}
function makeLion(){model=group(root,'CNY01_LuckyLion');
 movable.body=group(model,'BodyRig',0,0,0);const b=movable.body;

 // segmented curtain: overlapping shell sections rotating independently.

  let z=.42-j*.165;const panel=group(b,'FabricPanel_'+String(j+1).padStart(2,'0'),0,.82,z);movable['panel'+j]=panel;

  if(j===1||j===4){ell(panel,'Ornamental_medallion',mat.gold,[0,.22,-.04],[.10,.055,.05]);ell(panel,'Medallion_centre',mat.secondary,[0,.266,-.04],[.05,.022,.025]);}
 }
 // Tail, segmented tassel with gold tuft.
 const tail=group(b,'TailJoint',0,.96,-.76);movable.tail=tail;
 curve(tail,'TailCord',mat.gold,[[0,0,0],[0,.06,-.13],[0,.02,-.26],[0,-.05,-.38]],.055);
 ell(tail,'TailTuft',mat.fur,[0,-.08,-.41],[.13,.15,.16]);
 for(let j=0;j<9;j++){const a=j*Math.PI*2/9;cone(tail,'TailHair_'+j,mat.fur,[Math.cos(a)*.077,-.085+Math.sin(a)*.07,-.52],[.034,.16,.034],[Math.PI/2,.0,a]);}
 // Pivot mounted above forward edge of costume.
 const neck=group(b,'Neck',0,.94,.45);movable.neck=neck;const head=group(neck,'Head',0,.11,.13);movable.head=head;
 ell(head,'HeadMain',mat.primary,[0,0,.09],[.49,.48,.40]);
 ell(head,'Forehead',mat.secondary,[0,.25,.29],[.43,.245,.25]);
 // Neck and cheek mane, individually modelled tufts.
 for(let i=0;i<28;i++){
  const a=i*Math.PI*2/28;const x=Math.sin(a)*.47,y=Math.cos(a)*.43;
  let v=ell(head,'LayeredMane_'+String(i+1).padStart(2,'0'),i%4===0?mat.gold:mat.fur,[x,y,.045],[.102,.16,.105]);v.rotation.z=-a*.56;
 }
 for(let s of [-1,1]){

 // Nose and moustache.

 ell(head,'NoseFront',mat.darkGold,[0,-.116,.57],[.092,.048,.019]);
 for(let s of [-1,1]){
  curve(head,'Moustache_'+s,mat.fur,[[s*.08,-.20,.55],[s*.23,-.20,.52],[s*.33,-.14,.46]],.035);
  for(let k=0;k<3;k++)curve(head,'Whisker_'+s+'_'+k,mat.gold,[[s*.14,-.22+k*.018,.55],[s*.34,-.25+k*.055,.61],[s*.49,-.31+k*.085,.51]],.009);
 }
 // Lower jaw opens about a hinge rather than scaling mouth.
 const jaw=group(head,'JawJoint',0,-.235,.13);movable.jaw=jaw;
 ell(jaw,'LowerJaw',mat.secondary,[0,-.055,.245],[.36,.13,.32]);

function lionPose(name,t){resetPose();const b=movable.body,h=movable.head,n=movable.neck,tail=movable.tail;
 const idle=(t)=>{b.position.y=.012*sin(t*TAU/3);h.rotation.z=.025*sin(t*TAU/2.9);h.rotation.x=.02*sin(t*TAU/3.4);tail.rotation.x=.15*sin(t*TAU/2.2);};
 const blink=(strength)=>{for(let key of ['lidL','lidR']){movable[key].position.y=-.115*strength;movable[key].scale.y=1+1.7*strength}};
 const sway=(amount)=>{h.rotation.y=amount;movable.earL.rotation.z=.17*sin(t*9);movable.earR.rotation.z=-.17*sin(t*9);movable.feather.rotation.z=.13*sin(t*8);};
 const mouth=(amount)=>{movable.jaw.rotation.x=-.54*amount;};
 const walk=(local)=>{const phase=TAU*local;const keys=['FL','FR','BL','BR'];keys.forEach((k,i)=>{let offset=(i===0||i===3)?0:Math.PI;movable['leg'+k].rotation.x=.32*sin(phase+offset);movable['shin'+k].rotation.x=.15*Math.max(0,sin(phase+offset));});b.position.y=.026*Math.cos(phase*2);h.rotation.x=.04*sin(phase);for(let i=0;i<7;i++)movable['panel'+i].rotation.x=.055*sin(phase-i*.36);tail.rotation.y=.18*sin(phase);};
 if(name==='Idle'){idle(t);blink(Math.pow(Math.max(0,sin(t*TAU/4)),22)*.95);}
 if(name==='Blink'){idle(t);blink(sin(Math.PI*smooth(.13,.69,t))**4);}
 if(name==='HeadShake'){let env=sin(Math.PI*clamp(t/2.1));sway(.35*env*sin(t*TAU*2.3));h.rotation.z=.13*env*sin(t*TAU*2.6);b.rotation.y=.075*env*sin(t*TAU*2.3);}
 if(name==='OpenMouth'){idle(t);mouth(Math.pow(sin(Math.PI*clamp(t/1.35)),1.3));}
 if(name==='Walk'){walk(t/2);b.rotation.y=.035*sin(TAU*t/2);h.rotation.y=.075*sin(TAU*t/2);}
 if(name==='Jump'){let u=clamp(t/1.55),crouch=.11*(1-smooth(.08,.24,u))+.08*(smooth(.78,.9,u)*(1-smooth(.9,1,u))),lift=.54*Math.pow(Math.max(0,sin(Math.PI*smooth(.14,.84,u))),1.35);b.position.y=lift-crouch;n.rotation.x=-.20*sin(Math.PI*u);h.rotation.x=-.12*sin(Math.PI*u);for(let k of ['FL','FR','BL','BR']){movable['leg'+k].rotation.x=.45*sin(Math.PI*u);movable['shin'+k].rotation.x=-.24*sin(Math.PI*u);}tail.rotation.x=-.38*sin(Math.PI*u);}
 if(name==='Bow'){let u=clamp(t/2.4),v=smooth(.07,.43,u)*(1-smooth(.64,.96,u));n.rotation.x=.48*v;h.rotation.x=.22*v;b.position.y=-.08*v;movable.jaw.rotation.x=-.15*v;}

  let intro=1-smooth(.18,.26,u);h.rotation.x=.14*sin(t*5)*intro;blink(.88*Math.pow(Math.max(0,sin(t*4)),11)*intro);

  let dancing=smooth(.025,.09,u)*(1-smooth(.86,.96,u));
  sway(.22*dancing*sin(t*3.2));h.rotation.z+=.12*dancing*sin(t*6.4);b.position.y+=.05*dancing*(1+sin(t*6.4));b.rotation.y=.10*dancing*sin(t*3.2);
  for(let i=0;i<7;i++)movable['panel'+i].rotation.z=.07*dancing*sin(t*3.2-i*.43);
  for(let [i,k] of ['FL','FR','BL','BR'].entries())movable['leg'+k].rotation.x=.37*dancing*sin(t*6.4+i*Math.PI);

  let leap=smooth(.60,.66,u)*(1-smooth(.72,.79,u));b.position.y+=.30*leap;h.rotation.x-=.22*leap;
  let finale=smooth(.88,.96,u);n.rotation.x+=.24*finale;b.position.y+=.025*sin(t*8)*(1-finale);
 }

const s=Math.sin;
function genericPose(name,t){resetGeneric();const kind=catalogue.find(x=>x.id===selected).type,b=movable.body,u=Math.max(0,Math.min(1,t/(D[name]||2))),phase=t*TAU;
 const idle=()=>{b.position.y+=.016*s(t*2.2);b.rotation.z=.015*s(t*1.2);if(movable.head)movable.head.rotation.z=.025*s(t*1.7)};
 const legs=['legL','legR','legFL','legFR','legBL','legBR'];
 if(kind==='boy'||kind==='girl'||kind==='wealth'||kind==='lady'||kind==='gentleman'){
  const aL=movable.armL,aR=movable.armR,lL=movable.legL,lR=movable.legR,head=movable.head,torso=movable.torso;
  idle();
  const kneeL=movable.kneeL,kneeR=movable.kneeR,eL=movable.elbowL,eR=movable.elbowR;
  const wL=movable.wristL,wR=movable.wristR,hips=movable.hips;
  if(name==='Walk'||name==='Run'){
    const running=name==='Run',f=running?1.9:1,ph=t*TAU*f;
    lL.rotation.x=(running?.76:.50)*s(ph);
    lR.rotation.x=-(running?.76:.50)*s(ph);
    kneeL.rotation.x=Math.max(0,-s(ph))*(running?.9:.48);
    kneeR.rotation.x=Math.max(0,s(ph))*(running?.9:.48);
    aL.rotation.x=-(running?.65:.35)*s(ph);
    aR.rotation.x=(running?.65:.35)*s(ph);
    eL.rotation.x=running?-.60:-.13;eR.rotation.x=running?-.60:-.13;
    hips.rotation.y=.043*s(ph);b.position.y+=(running?.065:.028)*Math.abs(s(ph));
    if(running)movable.torso.rotation.x=.14;
  }
  if(name==='Jump'){
    const arc=Math.pow(Math.max(0,s(Math.PI*u)),1.15),anticipate=smooth(0,.15,u)*(1-smooth(.15,.28,u));
    b.position.y+=.46*arc-.09*anticipate;
    hips.rotation.x=.10*arc;
